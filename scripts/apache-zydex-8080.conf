# Zydex portal on port 8080 (Magnus uses port 80)
# Access: http://YOUR_SERVER_IP:8080
# For production subdomain on port 80, use apache-zydex.conf + DNS

Listen 8080
<VirtualHost *:8080>
    ServerName localhost

    DocumentRoot /var/www/zydex-portal

    <Directory /var/www/zydex-portal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api

    ErrorLog ${APACHE_LOG_DIR}/zydex-error.log
    CustomLog ${APACHE_LOG_DIR}/zydex-access.log combined
</VirtualHost>
