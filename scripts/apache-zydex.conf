# Apache virtual host for Zydex portal
# Place in /etc/apache2/sites-available/zydex.conf
# Enable: a2ensite zydex && a2enmod proxy proxy_http rewrite && systemctl reload apache2

<VirtualHost *:80>
    ServerName portal.zydex.com
    # ServerName your-domain.com

    DocumentRoot /var/www/zydex-portal

    <Directory /var/www/zydex-portal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api

    ErrorLog ${APACHE_LOG_DIR}/zydex-error.log
    CustomLog ${APACHE_LOG_DIR}/zydex-access.log combined
</VirtualHost>

# For HTTPS (recommended):
# certbot --apache -d portal.zydex.com
